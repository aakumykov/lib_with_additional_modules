plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

project.ext {
    artifactId = 'lib_0'
    groupId = 'com.github.aakumykov'

    majorVersionNum = 0
    minorVersionNum = 0
    patchVersionNum = 5

    versionCode = 5

    versionName = majorVersionNum + "." + minorVersionNum + "." + patchVersionNum
}

android {
    namespace groupId + '.' + artifactId
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

def isLocalDevelopment(
        localConfigFilePath = "../local.properties",
        isLocalDevelopmentFlag = "is_local_development"
) {
    def keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(file(localConfigFilePath)))

    def isLocalDevelopment = keystoreProperties[isLocalDevelopmentFlag]

    if (null == isLocalDevelopment) return false
    else return isLocalDevelopment
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit

    if (isLocalDevelopment()) {
        println "LOCAL DEVELOPMENT DETECTED"
        implementation project(':lib_1')
        implementation project(':lib_2')
    } else {
        println "REMOTE DEVELOPMENT DETECTED"
        implementation "com.github.aakumykov:lib_with_additional_modules:lib_1:0.0.1"
        implementation "com.github.aakumykov:lib_with_additional_modules:lib_2:0.0.1"
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.groupId
            artifactId = project.artifactId
            version = versionName
            afterEvaluate {
                from components.release
            }
        }
    }
}